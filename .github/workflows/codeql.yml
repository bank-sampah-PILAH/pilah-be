# CodeQL — static security analysis. Finds injection, auth bypass, and
# other taint-tracked vulnerabilities the linter and test suite can't see.
# This repo is private without GitHub Advanced Security, so results can't be
# uploaded to the Code Scanning tab (that upload requires GHAS). Analysis
# still runs and the SARIF report is attached as a workflow artifact.
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly scan catches newly-disclosed vulnerable patterns in unchanged code.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # CodeQL's PR overlay-base cache lives in the Actions cache; reading it
      # needs the workflow-runs API, which requires actions: read.
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Python needs no build — autobuild handles it (no-op for interpreted
      # languages). Single language matrix kept simple rather than expanded
      # later; add actions to the matrix if pilah-be ever gains TS/JS.
      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/autobuild@v3

      # upload: false — the code-scanning upload is what fails on a
      # non-GHAS private repo. SARIF stays in the workspace for the artifact
      # step below; the job still fails if CodeQL itself errors.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: false
          # Default SARIF path is outside the checkout dir; keep it inside so
          # the artifact step can grab it.
          output: codeql-sarif/python.sarif

      - name: Attach CodeQL SARIF (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-sarif/python.sarif
          if-no-files-found: error