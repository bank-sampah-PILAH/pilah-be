# CI — the merge gate for pilah-be. Runs on every push and PR. Covers:
#   - lint (ruff, report-only until findings cleaned up)
#   - tests (Django test suite on both sqlite and postgres:16)
#   - system checks incl. --deploy checks
#   - OpenAPI schema generation (drf-spectacular)
#   - DB migration check (applied migrations + makemigrations --check drift)
#   - Docker build + Trivy scan + SBOM
#   - secret scan (gitleaks, blocking)
#   - pip-audit dependency advisories (report-only for now)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Env shared by all management-command steps. Placeholders only — CI never
  # talks to real Google/Twilio/WhatsApp; the tests mock those clients.
  DJANGO_SECRET_KEY: ci-placeholder-secret-key
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  PILAH_ALLOW_FAKE_GOOGLE_TOKEN: "true"
  CORS_ALLOW_ALL_ORIGINS: "true"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # Ruff is not yet configured in-repo (no pyproject.toml). Report-only so
      # the gate stays green while findings get cleaned up; tighten to
      # blocking once a pyproject.toml with lint config lands.
      - name: Ruff lint (report only)
        continue-on-error: true
        run: ruff check .

      - name: Ruff format (report only)
        continue-on-error: true
        run: ruff format --check .

  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    # Postgres service container (postgres:16 = what prod Cloud SQL runs).
    # The sqlite matrix job ignores it and uses the settings default
    # (BASE_DIR/db.sqlite3). Service containers are always reachable on
    # localhost, so DB_HOST stays 127.0.0.1 in both jobs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pilah
          POSTGRES_USER: pilah
          POSTGRES_PASSWORD: pilah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilah"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Set database env (postgres)
        if: matrix.database == 'postgres'
        run: |
          echo "DB_ENGINE=django.db.backends.postgresql" >> "$GITHUB_ENV"
          echo "DB_NAME=pilah" >> "$GITHUB_ENV"
          echo "DB_USER=pilah" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=pilah" >> "$GITHUB_ENV"
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=5432" >> "$GITHUB_ENV"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: coverage run --source=api manage.py test api -v 2

      - name: Coverage report
        run: |
          coverage report --show-missing --skip-covered
          coverage xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.database }}
          path: coverage.xml
          if-no-files-found: error

  checks:
    name: System & deploy checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      # --deploy raises deploy-time settings issues (SECURE_HSTS_SECONDS,
      # SECURE_SSL_REDIRECT, etc.) as warnings. DEBUG=true (needed for tests/
      # fake google tokens) makes several fire, so only error-level fails.
      # Flip to --fail-level WARNING once a prod-shaped env is wired into CI.
      - name: Deploy checks
        continue-on-error: true
        run: python manage.py check --deploy

      - name: Generate OpenAPI schema
        run: python manage.py spectacular --file /tmp/openapi-schema.yml

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: /tmp/openapi-schema.yml
          if-no-files-found: error

  db-migrations:
    name: DB migrations
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pilah
          POSTGRES_USER: pilah
          POSTGRES_PASSWORD: pilah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilah"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: pilah
          DB_USER: pilah
          DB_PASSWORD: pilah
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: python manage.py migrate --noinput

      # Same check as the test job but standalone so migration regressions
      # fail here even when the test matrix is skipped/flaky.
      - name: Check for missing migrations
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: pilah
          DB_USER: pilah
          DB_PASSWORD: pilah
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

  docker:
    name: Docker build & scan
    runs-on: ubuntu-latest
    needs: [lint, checks]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pilah-be:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # Trivy: scan the built image for known vulnerabilities (CVEs).
      # Report-only for now; tighten to blocking with:
      #   exit-code: "1" + remove continue-on-error + add:
      #   --severity HIGH,CRITICAL --ignore-unfixed
      - name: Trivy scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pilah-be:ci
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Attach trivy SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: warn

      # SBOM: inventory of every package in the image (SPDX), kept as an
      # artifact for audit / supply-chain traceability.
      - name: SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: pilah-be:ci
          artifact-name: sbom.spdx.json
          format: spdx-json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    # Gitleaks: scans the full git history for high-entropy strings and known
    # secret patterns. Blocking — a leaked credential must fail the gate.
    # Private repo: run the gitleaks CLI via Docker rather than
    # gitleaks-action (which needs a license for private-repo PR mode).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks \
            detect --source /repo --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Attach gitleaks SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn

  security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    needs: lint
    # pip-audit: check the pinned requirements.txt against published advisory
    # databases (PyPI / OSV). Report-only for now — unknown findings state.
    # Tighten to blocking (drop continue-on-error) once the current findings
    # are triaged/fixed.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pip-audit (report only)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt