# CI — the merge gate for pilah-be. Runs on every push and PR. Covers:
#   - lint (ruff, blocking)
#   - tests (Django test suite on both sqlite and postgres:16, coverage >= 80%)
#   - system checks incl. --deploy (error-level, blocking)
#   - OpenAPI schema generation (drf-spectacular)
#   - DB migration check (applied migrations + makemigrations --check drift)
#   - migration safety lint (new migrations, ERROR-level, blocking)
#   - types (mypy strict, blocking)
#   - Docker build + smoke test + Trivy (HIGH/CRITICAL, blocking) + SBOM
#   - secret scan (gitleaks, blocking)
#   - pip-audit dependency advisories (blocking)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Env shared by all management-command steps. Placeholders only — CI never
  # talks to real Google/Twilio/WhatsApp; the tests mock those clients.
  DJANGO_SECRET_KEY: ci-placeholder-secret-key
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  PILAH_ALLOW_FAKE_GOOGLE_TOKEN: "true"
  CORS_ALLOW_ALL_ORIGINS: "true"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.6

      # pyproject.toml [tool.ruff] holds the config. Blocking: a failing rule
      # fails the gate. BLE001/S110/RUF012 are ignored there by design (DRF
      # patterns + intentional broad catches at API boundaries).
      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Lints the workflow files themselves (syntax, expression misuse,
      # invalid action inputs).
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest -color

  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    # Postgres service container (postgres:16 = what prod Cloud SQL runs).
    # The sqlite matrix job ignores it and uses the settings default
    # (BASE_DIR/db.sqlite3). Service containers are always reachable on
    # localhost, so DB_HOST stays 127.0.0.1 in both jobs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pilah
          POSTGRES_USER: pilah
          POSTGRES_PASSWORD: pilah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilah"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      # Catches conflicting pins in requirements.txt (A needs B>=2, B pinned
      # to 1.x) before they break at runtime on Cloud Run.
      - name: pip check (dependency conflicts)
        run: pip check

      - name: Set database env (postgres)
        if: matrix.database == 'postgres'
        run: |
          {
            echo "DB_ENGINE=django.db.backends.postgresql"
            echo "DB_NAME=pilah"
            echo "DB_USER=pilah"
            echo "DB_PASSWORD=pilah"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
          } >> "$GITHUB_ENV"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
                # Plain `manage.py test` = discovery across every Django app, so tests
        # in future apps (not just api/) still gate the build.
        run: coverage run --source=api manage.py test -v 2

      - name: Coverage report (fail under 80%)
        run: |
          coverage report --show-missing --skip-covered --fail-under=80
          coverage xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.database }}
          path: coverage.xml
          if-no-files-found: error

  checks:
    name: System & deploy checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      # --deploy raises deploy-time settings issues as warnings. DEBUG=true
      # (needed for tests/fake google tokens) fires several (HSTS, SSL
      # redirect, cookie flags), so only error-level checks fail here.
      # Tighten to --fail-level WARNING once a prod-shaped env is in CI.
      - name: Deploy checks
        run: python manage.py check --deploy --fail-level ERROR

      - name: Generate OpenAPI schema
        run: python manage.py spectacular --file /tmp/openapi-schema.yml

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: /tmp/openapi-schema.yml
          if-no-files-found: error

  db-migrations:
    name: DB migrations
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pilah
          POSTGRES_USER: pilah
          POSTGRES_PASSWORD: pilah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilah"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: pilah
          DB_USER: pilah
          DB_PASSWORD: pilah
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: python manage.py migrate --noinput

      # Same check as the test job but standalone so migration regressions
      # fail here even when the test matrix is skipped/flaky.
      - name: Check for missing migrations
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: pilah
          DB_USER: pilah
          DB_PASSWORD: pilah
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

  migration-linter:
    name: Migration safety lint
    runs-on: ubuntu-latest
    needs: lint
    # django-migration-linter flags destructive migration operations (dropped
    # columns/tables, renamed fields, type changes) that makemigrations
    # --check cannot see — the kind that silently eat prod data on Cloud SQL
    # when `migrate` runs in the deploy entrypoint. Report-only for now:
    # existing migrations predate this gate and may carry findings. Once
    # triaged, tighten to blocking by removing continue-on-error (fail on
    # ERROR only: --ignore-applied-migrations + default warning tolerance).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install django-migration-linter

      # Blocking on ERROR. Historical migrations that predate this gate and
      # lint ERR (three api migrations + the third-party token_blacklist app,
      # excluded wholesale) are skipped by exact name so only NEW migrations
      # must be clean. If a needed migration is blocked, fix the migration
      # (not the gate) or add a targeted --ignore-name-contains.
      - name: Lint migrations (new migrations only)
        env:
          MIGRATION_LINTER: "1"
        run: python manage.py lintmigrations --database default --exclude-apps token_blacklist --ignore-name 0002_user_is_primary_pengelola 0003_alter_banksampah_foto_kegiatan_and_more 0004_alter_banksampah_foto_logo

  docker:
    name: Docker build & scan
    runs-on: ubuntu-latest
    needs: [lint, checks, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pilah-be:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # Smoke-test the built image: boots it with a placeholder env, waits for
      # the container HEALTHCHECK to report healthy, and verifies /healthz
      # responds. Catches broken entrypoint/migrations/gunicorn wiring before
      # deploy, not on Cloud Run.
      - name: Smoke test image
        run: |
          docker run -d --name smoke \
            -e DJANGO_SECRET_KEY=ci-placeholder-secret-key \
            -e DJANGO_DEBUG=true \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e PILAH_ALLOW_FAKE_GOOGLE_TOKEN=true \
            -e CORS_ALLOW_ALL_ORIGINS=true \
            -p 8080:8080 \
            pilah-be:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' smoke)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && { docker logs smoke; exit 1; }
            sleep 3
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' smoke)" = "healthy" ] \
            || { docker logs smoke; exit 1; }
          curl -fsS http://127.0.0.1:8080/healthz | tee /dev/stderr | grep -q '"status": *"ok"'
          docker rm -f smoke

      # Trivy: scan the built image for known vulnerabilities (CVEs).
      # Blocking on HIGH/CRITICAL with a known fix. MEDIUM/LOW and unfixable
      # findings don't gate. If a new CVE has no fix yet, triage with a
      # .trivyignore entry (with an expiry comment), never by loosening this.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pilah-be:ci
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Attach trivy SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: warn

      # SBOM: inventory of every package in the image (SPDX), kept as an
      # artifact for audit / supply-chain traceability.
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: pilah-be:ci
          artifact-name: sbom.spdx.json
          format: spdx-json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    # Gitleaks: scans the full git history for high-entropy strings and known
    # secret patterns. Blocking — a leaked credential must fail the gate.
    # Private repo: run the gitleaks CLI via Docker rather than
    # gitleaks-action (which needs a license for private-repo PR mode).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks \
            detect --source /repo --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Attach gitleaks SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn

  types:
    name: Type check
    runs-on: ubuntu-latest
    needs: lint
    # mypy --strict against pyproject.toml [tool.mypy]: full first-party
    # checking, django-stubs plugin resolves models/FKs. Blocking — new code
    # must be fully typed.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==2.3.1 django-stubs djangorestframework-stubs==3.18.1

      - name: mypy strict
        run: mypy api config

  security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    needs: lint
    # pip-audit: check the pinned requirements.txt against published advisory
    # databases (PyPI / OSV). Blocking — the requirements are exact-pinned, so
    # a new advisory means a real version bump.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Blocking: requirements.txt pins exact versions, so a new advisory
      # means a real bump is needed (as done for Django 6.0.8, DRF 3.17.2,
      # sqlparse, pyasn1, cryptography). If an advisory has no fix yet,
      # triage it with a pip-audit --ignore-vuln in a follow-up.
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r requirements.txt