# CI — the merge gate for pilah-be. One verification job, one dependency
# install: ruff, postgres tests with coverage, migration checks, django
# checks, mypy. Deliberately single-job — small/mid project on a limited
# free-tier Actions budget; merge feedback should be fast and cheap.
#
# Not here on purpose:
#   - gitleaks / pip-audit / migration-linter -> scheduled-checks.yml
#     (weekly cron + manual dispatch)
#   - docker build + trivy -> deploy-cloud-run.yml (built once for deploy,
#     scanned there; no duplicate image build in CI)
name: CI

on:
  push:
    branches:
      - staging
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Env shared by all management-command steps. Placeholders only — CI never
  # talks to real Google/Twilio/WhatsApp; the tests mock those clients.
  DJANGO_SECRET_KEY: ci-placeholder-secret-key
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  PILAH_ALLOW_FAKE_GOOGLE_TOKEN: "true"
  CORS_ALLOW_ALL_ORIGINS: "true"

jobs:
  verify:
    name: Verify (lint, tests, migrations, checks, types)
    runs-on: ubuntu-latest
    # Postgres service container (postgres:16 = what prod Cloud SQL runs).
    # Service containers are always reachable on localhost, so DB_HOST stays
    # 127.0.0.1.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pilah
          POSTGRES_USER: pilah
          POSTGRES_PASSWORD: pilah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilah"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: pilah
      DB_USER: pilah
      DB_PASSWORD: pilah
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Single install for the whole job — no per-check reinstalls.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.6 coverage mypy==2.3.1 django-stubs djangorestframework-stubs==3.18.1

      # pyproject.toml [tool.ruff] holds the config. Blocking: a failing rule
      # fails the gate. BLE001/S110/RUF012 are ignored there by design (DRF
      # patterns + intentional broad catches at API boundaries).
      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Catches conflicting pins in requirements.txt (A needs B>=2, B pinned
      # to 1.x) before they break at runtime on Cloud Run.
      - name: pip check (dependency conflicts)
        run: pip check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      # Plain `manage.py test` = discovery across every Django app, so tests
      # in future apps (not just api/) still gate the build.
      - name: Run tests with coverage
        run: coverage run --source=api manage.py test -v 2

      - name: Coverage report (fail under 80%)
        run: coverage report --show-missing --skip-covered --fail-under=80

      - name: Django system checks
        run: python manage.py check

      # --deploy raises deploy-time settings issues as warnings. DEBUG=true
      # (needed for tests/fake google tokens) fires several (HSTS, SSL
      # redirect, cookie flags), so only error-level checks fail here.
      # Tighten to --fail-level WARNING once a prod-shaped env is in CI.
      - name: Deploy checks
        run: python manage.py check --deploy --fail-level ERROR

      # mypy --strict against pyproject.toml [tool.mypy]: full first-party
      # checking, django-stubs plugin resolves models/FKs. Blocking — new
      # code must be fully typed.
      - name: mypy strict
        run: mypy api config