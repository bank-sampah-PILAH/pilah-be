# CI — the merge gate for pilah-be. One verification job runs lint, postgres
# tests with coverage, migration checks, Django checks, and mypy. Successful
# staging pushes then deploy the verified commit to Fly.io.
#
# Not here on purpose:
#   - gitleaks / pip-audit / migration-linter -> scheduled-checks.yml
#     (weekly cron + manual dispatch)
#   - docker build + trivy -> deploy-cloud-run.yml (built once for deploy,
#     scanned there; no duplicate image build in CI)
name: CI

on:
  push:
    branches:
      - staging
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Env shared by all management-command steps. Placeholders only — CI never
  # talks to real Google/Twilio/WhatsApp; the tests mock those clients.
  DJANGO_SECRET_KEY: ci-placeholder-secret-key
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  PILAH_ALLOW_FAKE_GOOGLE_TOKEN: "true"
  CORS_ALLOW_ALL_ORIGINS: "true"

jobs:
  verify:
    name: Verify (lint, tests, migrations, checks, types)
    runs-on: ubuntu-latest
    # Postgres service container (postgres:16 = what prod Cloud SQL runs).
    # Service containers are always reachable on localhost, so DB_HOST stays
    # 127.0.0.1.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pilah
          POSTGRES_USER: pilah
          POSTGRES_PASSWORD: pilah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilah"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: pilah
      DB_USER: pilah
      DB_PASSWORD: pilah
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
        with:
          # PR diff coverage compares against the actual stacked base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Single install for the whole job — no per-check reinstalls.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.6 coverage diff-cover==10.6.0 mypy==2.3.1 django-stubs djangorestframework-stubs==3.18.1

      # pyproject.toml [tool.ruff] holds the config. Blocking: a failing rule
      # fails the gate. BLE001/S110/RUF012 are ignored there by design (DRF
      # patterns + intentional broad catches at API boundaries).
      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Catches conflicting pins in requirements.txt (A needs B>=2, B pinned
      # to 1.x) before they break at runtime on Cloud Run.
      - name: pip check (dependency conflicts)
        run: pip check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      # Plain `manage.py test` = discovery across every Django app, so tests
      # in future apps (not just api/) still gate the build.
      - name: Run tests with coverage
        run: coverage run --source=api manage.py test -v 2

      - name: Coverage report (fail under 80%)
        run: coverage report --show-missing --skip-covered --fail-under=80

      # XML report for the SonarQube step below (sonar.python.coverage.
      # reportPaths reads it); not a gate here — the coverage report above
      # already enforces 80%.
      - name: Coverage XML for Sonar
        run: coverage xml

      # Report only executable lines changed by this PR. The base ref comes
      # from GitHub so stacked PRs compare against their immediate parent.
      - name: PR diff coverage (fail under 80%)
        if: github.event_name == 'pull_request'
        run: >-
          diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=80
          --total-percent-float
          --show-uncovered

      - name: Django system checks
        run: python manage.py check

      # --deploy raises deploy-time settings issues as warnings. DEBUG=true
      # (needed for tests/fake google tokens) fires several (HSTS, SSL
      # redirect, cookie flags), so only error-level checks fail here.
      # Tighten to --fail-level WARNING once a prod-shaped env is in CI.
      - name: Deploy checks
        run: python manage.py check --deploy --fail-level ERROR

      # mypy --strict against pyproject.toml [tool.mypy]: full first-party
      # checking, django-stubs plugin resolves models/FKs. Blocking — new
      # code must be fully typed. tests/ holds the refactor safety net
      # outside api/ so it survives the modular-monolith split.
      - name: mypy strict
        run: mypy api config tests

      # --- SonarQube analysis (was its own sonar.yml workflow) ---
      #
      # Why folded in here instead of a separate workflow:
      #   1. Coverage: Sonar needs coverage.xml, and that file only exists
      #      inside this workspace after `coverage run`/`coverage xml`. A
      #      separate workflow would need artifact upload/download between
      #      jobs with a race between the two concurrent runs, and an extra
      #      runner minute burned re-checking out and re-installing. Here the
      #      report is just there.
      #   2. One gate, one place: CI is already the merge gate, so a failed
      #      Sonar push surfaces in the same run a reviewer already watches.
      #   3. The sonar.yml version needed the same checkout (fetch-depth 0)
      #      and pip-less scanner anyway; nothing about being a separate file
      #      added value.
      #
      # Community Edition has no branch support, so the destination project
      # is switched per branch (main -> pilah-be, staging/others ->
      # pilah-be-staging; PRs report to the staging project, non-gating).
      # SONAR_HOST_URL and the two SONAR_TOKEN_* secrets are repo settings.
      - name: Pick SonarQube project key by branch
        id: pick
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "key=pilah-be" >> "$GITHUB_OUTPUT"
          else
            echo "key=pilah-be-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ steps.pick.outputs.key == 'pilah-be' && secrets.SONAR_TOKEN || secrets.SONAR_TOKEN_STAGING }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ steps.pick.outputs.key }}
            -Dsonar.sources=api,config
            -Dsonar.tests=api
            -Dsonar.test.inclusions=**/tests.py
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/migrations/**,**/*.pyc,**/__pycache__/**,**/staticfiles/**,reference/**
            -Dsonar.python.version=3.12

  deploy_staging:
    name: Deploy staging to Fly.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://pilah-be-staging.fly.dev
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy verified commit
        run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # One smoke check after deploy: /healthz does a DB round-trip, so this
      # catches a deploy that went out but came up dead.
      - name: Smoke check /healthz
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://pilah-be-staging.fly.dev/healthz || true)
            if [ "$code" = "200" ]; then echo "healthz OK"; exit 0; fi
            echo "healthz=$code, retrying in 10s ($i/12)"; sleep 10
          done
          echo "healthz never returned 200"; exit 1
