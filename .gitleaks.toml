# Allowlist for gitleaks (`detect` reads this file automatically).
# Extend only with false positives verified against the finding — never to
# silence a real leak.
[allowlist]
    # Django migration files are schema operations only: the flagged "keys"
    # are migration dependency names like
    # "0007_banksampah_jenis_organisasi_banksampah_parent" — long
    # underscore-joined identifiers that trip the generic-api-key entropy
    # heuristic. No credentials can live in a migration's dependencies tuple.
    paths = [
        '''api/migrations/.*\.py''',
    ]