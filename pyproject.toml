[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E4,E7,E9+F = pyflakes correctness. I = import sorting. B = bugbear.
# Rules intentionally not enabled: BLE001/S110 (views intentionally catch
# broad Exception at API boundaries), RUF012 (DRF serializers/views rely on
# mutable class attrs by design).
select = ["E4", "E7", "E9", "F", "I", "B", "FURB"]
ignore = [
    # DRF: Serializer/ViewSet class attributes are mutable by design.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Tests build verbose Decimals for readability and assert loose behavior.
"api/tests.py" = ["FURB157"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
# Keep the checker strict while tolerating untyped third-party libs whose
# stubs aren't shipped (openpyxl, google-cloud-storage, whitenoise, drf
# internals via django-stubs coverage gaps). First-party code stays fully
# checked — ignore_missing_imports never silences errors in api/ or config/.
ignore_missing_imports = true
# Django needs its models resolved for FK/related lookups to type-check.
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.mypy-overrides]
module = [
    "openpyxl.*",
    "google.*",
    "whitenoise.*",
]
ignore_missing_imports = true