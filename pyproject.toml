[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E4,E7,E9+F = pyflakes correctness. I = import sorting. B = bugbear.
# Rules intentionally not enabled: BLE001/S110 (views intentionally catch
# broad Exception at API boundaries), RUF012 (DRF serializers/views rely on
# mutable class attrs by design).
select = ["E4", "E7", "E9", "F", "I", "B", "FURB"]
ignore = [
    # DRF: Serializer/ViewSet class attributes are mutable by design.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Tests build verbose Decimals for readability and assert loose behavior.
"api/tests.py" = ["FURB157"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"